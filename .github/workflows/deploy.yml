name: CI / Deploy

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main]

jobs:
  # ── Runs on every push to main and on PRs ─────────────────────
  test:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

      # Save the build so the deploy job can reuse it without rebuilding
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Runs only on push to deploy ───────────────────────────────
  # Retrieves the dist/ artifact produced by the test job for the same
  # commit (push main:deploy reuses the same SHA), so nothing is rebuilt.
  deploy:
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download tested build
        run: |
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "dist-${{ github.sha }}") | .id' | head -1)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::No tested build found for ${{ github.sha }}. Push to main first."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" > dist.zip
          unzip dist.zip -d dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build the Vercel output directory from the downloaded dist/
      # without triggering a server-side rebuild (--prebuilt).
      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          node -e "
            const v = require('./vercel.json');
            const rewrites = (v.rewrites || []).map(r => ({ src: r.source, dest: r.destination }));
            const config = { version: 3, routes: [{ handle: 'filesystem' }, ...rewrites] };
            require('fs').writeFileSync('.vercel/output/config.json', JSON.stringify(config, null, 2));
          "

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: npx vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
